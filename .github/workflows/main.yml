# .github/workflows/main.yml
name: Main - Build & Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    name: Build plugin zip & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: block_mark_manager

      - name: Generate timestamp
        id: ts
        run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build plugin zip
        run: |
          # Moodle expects a top-level folder named after the plugin.
          # The checkout already places files in `block_mark_manager/`,
          # so we just zip that folder as-is.
          zip -r "block_mark_manager.zip" block_mark_manager \
            -x "block_mark_manager/.git/*" \
            -x "block_mark_manager/.github/*" \
            -x "block_mark_manager/.gitignore" \
            -x "block_mark_manager/.gitattributes"

      - name: Show archive contents
        run: unzip -l block_mark_manager.zip

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "mark_manager-${{ steps.ts.outputs.timestamp }}"
          name: "mark_manager:${{ steps.ts.outputs.timestamp }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: block_mark_manager.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
